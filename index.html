        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')

                                            question: 'O que caracteriza um código CSS escalável e de fácil manutenção?',
                                            options: ['Uso excessivo de !important em todas as regras', 'Divisão modular por componentes e variáveis bem definidas', 'Escrever todo o estilo em uma única linha', 'Evitar uso de classes'],
                                            correct: 1,
                                            hint: 'Modularidade.',
                                            explanation: 'Modularidade e variáveis estruturadas permitem que o sistema cresça sem caos.'
                                        }
                                    ],
                                    review: 'Organização modular, comentários claros e padronização garantem escalabilidade em grandes equipes.'
                                }
                            ]
                        }
                    ],
                    capstone: {
                        title: 'Projeto Prático Nível 3: Dashboard Completo e Animado',
                        description: 'Construa um Dashboard profissional completo, utilizando CSS Grid avançado, variáveis CSS de tema, animações suaves com keyframes, transições interativas e total acessibilidade WCAG.',
                        initialHtml: '<div class="dashboard">\n    <aside class="sidebar">\n        <h2>Painel</h2>\n        <nav>\n            <a href="#" class="active">Visão Geral</a>\n            <a href="#">Estatísticas</a>\n            <a href="#">Configurações</a>\n        </nav>\n    </aside>\n    <main class="content">\n        <header class="topbar">\n            <h1>Bem-vindo de volta, Dev!</h1>\n            <div class="user-badge">Admin</div>\n        </header>\n        <section class="stats-grid">\n            <div class="stat-card"><h3>Usuários</h3><p class="number">1,240</p></div>\n            <div class="stat-card"><h3>Receita</h3><p class="number">R$ 45k</p></div>\n            <div class="stat-card"><h3>Projetos</h3><p class="number">12</p></div>\n        </section>\n    </main>\n</div>',
                        initialCss: ':root { --bg-color: #f1f5f9; --card-bg: #ffffff; --primary: #6366f1; --text: #1e293b; }\nbody { font-family: sans-serif; margin: 0; background: var(--bg-color); color: var(--text); }\n.dashboard { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }\n.sidebar { background: #1e293b; color: white; padding: 30px 20px; display: flex; flex-direction: column; gap: 30px; }\n.sidebar nav { display: flex; flex-direction: column; gap: 10px; }\n.sidebar a { color: #94a3b8; text-decoration: none; padding: 10px 15px; border-radius: 6px; transition: all 0.3s ease; }\n.sidebar a:hover, .sidebar a.active { background: var(--primary); color: white; transform: translateX(5px); }\n.content { padding: 40px; display: flex; flex-direction: column; gap: 30px; }\n.topbar { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 20px 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }\n.user-badge { background: #e0e7ff; color: var(--primary); padding: 6px 14px; border-radius: 20px; font-weight: bold; }\n.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }\n.stat-card { background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); transition: transform 0.3s ease, box-shadow 0.3s ease; animation: fadeIn 0.5s ease-out; }\n.stat-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(99, 102, 241, 0.1); }\n.stat-card .number { font-size: 28px; font-weight: bold; color: var(--primary); margin-top: 10px; }\n@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }'
                    }
                }
            ]
        };

        // Application State Management
        const app = {
            state: {
                currentView: 'home', // 'home', 'curriculum', 'lesson', 'project'
                currentLevelId: null,
                currentModuleId: null,
                currentLessonId: null,
                progress: {} // { 'les-1-1-1': true, ... }
            },

            init() {
                this.loadProgress();
                this.render();
            },

            loadProgress() {
                const saved = localStorage.getItem('devacademy_progress');
                if (saved) {
                    try {
                        this.state.progress = JSON.parse(saved);
                    } catch (e) {
                        this.state.progress = {};
                    }
                }
            },

            saveProgress() {
                localStorage.setItem('devacademy_progress', JSON.stringify(this.state.progress));
            },

            calculateGlobalProgress() {
                let totalLessons = 0;
                let completedLessons = 0;
                courseData.levels.forEach(level => {
                    level.modules.forEach(mod => {
                        mod.lessons.forEach(les => {
                            totalLessons++;
                            if (this.state.progress[les.id]) {
                                completedLessons++;
                            }
                        });
                    });
                });
                if (totalLessons === 0) return 0;
                return Math.round((completedLessons / totalLessons) * 100);
            },

            navigateToHome() {
                this.state.currentView = 'home';
                this.state.currentLevelId = null;
                this.state.currentModuleId = null;
                this.state.currentLessonId = null;
                this.render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },

            navigateToLevel(levelId) {
                this.state.currentView = 'curriculum';
                this.state.currentLevelId = levelId;
                this.render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },

            navigateToLesson(levelId, moduleId, lessonId) {
                this.state.currentView = 'lesson';
                this.state.currentLevelId = levelId;
                this.state.currentModuleId = moduleId;
                this.state.currentLessonId = lessonId;
                this.render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
                setTimeout(() => {
                    this.updateSandboxPreview();
                }, 50);
            },

            navigateToProject(levelId) {
                this.state.currentView = 'project';
                this.state.currentLevelId = levelId;
                this.render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
                setTimeout(() => {
                    this.updateProjectPreview();
                }, 50);
            },

            toggleLessonCompletion(lessonId) {
                this.state.progress[lessonId] = !this.state.progress[lessonId];
                this.saveProgress();
                this.render();
            },

            resetProgress() {
                this.state.progress = {};
                this.saveProgress();
                this.render();
                this.showModal('Progresso Reiniciado', 'Todo o seu progresso no curso foi reiniciado com sucesso.', 'fa-rotate-right', 'text-amber-600', 'bg-amber-100');
            },

            showModal(title, message, iconClass = 'fa-check', iconColor = 'text-emerald-600', iconBg = 'bg-emerald-100') {
                const modal = document.getElementById('custom-modal');
                const modalTitle = document.getElementById('modal-title');
                const modalMessage = document.getElementById('modal-message');
                const modalIcon = document.getElementById('modal-icon');

                modalTitle.textContent = title;
                modalMessage.textContent = message;
                modalIcon.className = `w-12 h-12 rounded-full ${iconBg} ${iconColor} flex items-center justify-center text-xl mb-4 mx-auto`;
                modalIcon.innerHTML = `<i class="fa-solid ${iconClass}"></i>`;

                modal.classList.remove('hidden');
            },

            closeModal() {
                document.getElementById('custom-modal').classList.add('hidden');
            },

            render() {
                // Update global progress indicator in header
                document.getElementById('global-progress').textContent = this.calculateGlobalProgress();

                const container = document.getElementById('main-container');
                
                if (this.state.currentView === 'home') {
                    container.innerHTML = this.renderHomeView();
                } else if (this.state.currentView === 'curriculum') {
                    container.innerHTML = this.renderCurriculumView();
                } else if (this.state.currentView === 'lesson') {
                    container.innerHTML = this.renderLessonView();
                } else if (this.state.currentView === 'project') {
                    container.innerHTML = this.renderProjectView();
                }
            },

            renderHomeView() {
                const levelsHtml = courseData.levels.map(level => {
                    let totalL = 0;
                    let compL = 0;
                    level.modules.forEach(m => m.lessons.forEach(l => {
                        totalL++;
                        if (this.state.progress[l.id]) compL++;
                    }));
                    const pct = totalL > 0 ? Math.round((compL / totalL) * 100) : 0;

                    const borderColors = { emerald: 'border-emerald-200 hover:border-emerald-400', indigo: 'border-indigo-200 hover:border-indigo-400', purple: 'border-purple-200 hover:border-purple-400' };
                    const bgBadge = { emerald: 'bg-emerald-100 text-emerald-700', indigo: 'bg-indigo-100 text-indigo-700', purple: 'bg-purple-100 text-purple-700' };
                    const btnColors = { emerald: 'bg-emerald-600 hover:bg-emerald-700', indigo: 'bg-indigo-600 hover:bg-indigo-700', purple: 'bg-purple-600 hover:bg-purple-700' };

                    return `
                        <div class="bg-white rounded-2xl border ${borderColors[level.color]} shadow-sm hover:shadow-md transition-all p-6 flex flex-col justify-between">
                            <div>
                                <div class="flex items-center justify-between mb-4">
                                    <div class="w-12 h-12 rounded-xl ${bgBadge[level.color]} flex items-center justify-center text-xl">
                                        <i class="fa-solid ${level.icon}"></i>
                                    </div>
                                    <span class="text-xs font-semibold px-2.5 py-1 rounded-full ${bgBadge[level.color]}">${pct}% Concluído</span>
                                </div>
                                <h3 class="text-xl font-bold text-slate-900 mb-1">${level.title}</h3>
                                <p class="text-sm font-medium text-slate-600 mb-3">${level.subtitle}</p>
                                <p class="text-sm text-slate-500 mb-6">${level.description}</p>
                            </div>
                            <div>
                                <div class="w-full bg-slate-100 h-2 rounded-full mb-4 overflow-hidden">
                                    <div class="bg-brand-600 h-full rounded-full transition-all duration-500" style="width: ${pct}%"></div>
                                </div>
                                <button onclick="app.navigateToLevel('${level.id}')" class="w-full ${btnColors[level.color]} text-white font-medium py-2.5 px-4 rounded-xl transition-colors flex items-center justify-center space-x-2">
                                    <span>Acessar Nível</span>
                                    <i class="fa-solid fa-arrow-right text-sm"></i>
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="space-y-12">
                        <!-- Hero Section -->
                        <div class="bg-gradient-to-r from-brand-700 via-indigo-600 to-violet-600 rounded-3xl p-8 md:p-12 text-white shadow-xl relative overflow-hidden">
                            <div class="relative z-10 max-w-2xl">
                                <span class="bg-white/20 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider mb-4 inline-block backdrop-blur-sm">Do Zero ao Profissional</span>
                                <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight mb-4">Domine HTML e CSS de Verdade</h1>
                                <p class="text-indigo-100 text-lg mb-8 leading-relaxed">Aprenda na prática com aulas estruturadas, teoria detalhada, exercícios interativos e projetos completos adaptados para iniciantes e avançados.</p>
                                <div class="flex flex-wrap gap-4">
                                    <button onclick="app.navigateToLevel('iniciante')" class="bg-white text-brand-700 font-bold px-6 py-3 rounded-xl shadow hover:bg-indigo-50 transition-colors">
                                        Começar do Zero
                                    </button>
                                    <a href="#niveis-section" class="bg-brand-800/50 hover:bg-brand-800 text-white font-medium px-6 py-3 rounded-xl border border-white/20 backdrop-blur-sm transition-colors flex items-center">
                                        Ver Currículo Completo
                                    </a>
                                </div>
                            </div>
                            <div class="absolute -right-10 -bottom-10 opacity-10 text-9xl">
                                <i class="fa-brands fa-html5"></i>
                            </div>
                        </div>

                        <!-- Levels Grid -->
                        <div id="niveis-section">
                            <div class="text-center max-w-2xl mx-auto mb-10">
                                <h2 class="text-2xl md:text-3xl font-bold text-slate-900 mb-3">Trilha de Aprendizagem Progressiva</h2>
                                <p class="text-slate-600">Escolha o nível ideal para o seu momento atual ou siga a trilha recomendada passo a passo.</p>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                                ${levelsHtml}
                            </div>
                        </div>
                    </div>
                `;
            },

            renderCurriculumView() {
                const level = courseData.levels.find(l => l.id === this.state.currentLevelId);
                if (!level) return this.navigateToHome();

                let totalL = 0;
                let compL = 0;
                level.modules.forEach(m => m.lessons.forEach(l => {
                    totalL++;
                    if (this.state.progress[l.id]) compL++;
                }));
                const pct = totalL > 0 ? Math.round((compL / totalL) * 100) : 0;

                const modulesHtml = level.modules.map(mod => {
                    const lessonsHtml = mod.lessons.map(les => {
                        const isDone = !!this.state.progress[les.id];
                        return `
                            <div class="bg-white border border-slate-200 hover:border-brand-300 rounded-xl p-4 flex items-center justify-between transition-all shadow-sm">
                                <div class="flex items-center space-x-3 cursor-pointer flex-grow" onclick="app.navigateToLesson('${level.id}', '${mod.id}', '${les.id}')">
                                    <div class="w-8 h-8 rounded-full ${isDone ? 'bg-emerald-100 text-emerald-600' : 'bg-slate-100 text-slate-400'} flex items-center justify-center font-bold text-sm">
                                        <i class="fa-solid ${isDone ? 'fa-check' : 'fa-book-open'}"></i>
                                    </div>
                                    <div>
                                        <h4 class="font-bold text-slate-800 hover:text-brand-600 transition-colors text-base">${les.title}</h4>
                                        <p class="text-xs text-slate-500">${les.objectives.length} objetivos de aprendizagem</p>
                                    </div>
                                </div>
                                <div class="flex items-center space-x-3">
                                    <button onclick="app.toggleLessonCompletion('${les.id}')" title="Marcar como concluída" class="text-xs px-3 py-1.5 rounded-lg font-medium transition-colors ${isDone ? 'bg-emerald-100 text-emerald-700 hover:bg-emerald-200' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                                        ${isDone ? '<i class="fa-solid fa-check mr-1"></i> Concluída' : 'Marcar Concluída'}
                                    </button>
                                    <button onclick="app.navigateToLesson('${level.id}', '${mod.id}', '${les.id}')" class="bg-brand-50 text-brand-600 hover:bg-brand-600 hover:text-white p-2 rounded-lg transition-colors">
                                        <i class="fa-solid fa-arrow-right"></i>
                                    </button>
                                </div>
                            </div>
                        `;
                    }).join('');

                    return `
                        <div class="bg-slate-50 border border-slate-200 rounded-2xl p-6 mb-6">
                            <h3 class="text-lg font-bold text-slate-900 mb-1">${mod.title}</h3>
                            <p class="text-sm text-slate-600 mb-4">${mod.description}</p>
                            <div class="space-y-3">
                                ${lessonsHtml}
                            </div>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="space-y-8">
                        <!-- Breadcrumb & Header -->
                        <div>
                            <button onclick="app.navigateToHome()" class="text-sm text-brand-600 hover:text-brand-700 font-medium mb-4 flex items-center space-x-1">
                                <i class="fa-solid fa-arrow-left mr-1"></i> Voltar para Início
                            </button>
                            <div class="bg-white border border-slate-200 rounded-2xl p-6 md:p-8 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                                <div>
                                    <span class="text-xs font-semibold px-3 py-1 rounded-full bg-brand-100 text-brand-700 uppercase tracking-wide mb-2 inline-block">${level.id}</span>
                                    <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900 mb-2">${level.title}</h1>
                                    <p class="text-slate-600">${level.description}</p>
                                </div>
                                <div class="w-full md:w-64 bg-slate-50 p-4 rounded-xl border border-slate-200">
                                    <div class="flex justify-between text-sm font-bold text-slate-700 mb-2">
                                        <span>Progresso do Nível</span>
                                        <span>${pct}%</span>
                                    </div>
                                    <div class="w-full bg-slate-200 h-2.5 rounded-full mb-3 overflow-hidden">
                                        <div class="bg-brand-600 h-full rounded-full transition-all duration-500" style="width: ${pct}%"></div>
                                    </div>
                                    <button onclick="app.navigateToProject('${level.id}')" class="w-full bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-700 hover:to-indigo-700 text-white font-medium py-2 px-4 rounded-lg text-sm shadow-sm transition-all flex items-center justify-center space-x-2">
                                        <i class="fa-solid fa-laptop-code"></i>
                                        <span>Projeto Prático de Conclusão</span>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Modules & Lessons List -->
                        <div>
                            <h2 class="text-xl font-bold text-slate-900 mb-6">Módulos do Curso</h2>
                            ${modulesHtml}
                        </div>
                    </div>
                `;
            },

            renderLessonView() {
                const level = courseData.levels.find(l => l.id === this.state.currentLevelId);
                if (!level) return this.navigateToHome();
                const module = level.modules.find(m => m.id === this.state.currentModuleId);
                if (!module) return this.navigateToLevel(level.id);
                const lesson = module.lessons.find(l => l.id === this.state.currentLessonId);
                if (!lesson) return this.navigateToLevel(level.id);

                const isDone = !!this.state.progress[lesson.id];

                // Objectives list
                const objectivesHtml = lesson.objectives.map(obj => `
                    <li class="flex items-start space-x-2 text-slate-700">
                        <i class="fa-solid fa-circle-check text-brand-600 mt-1"></i>
                        <span>${escapeHtml(obj)}</span>
                    </li>
                `).join('');

                // Exercises rendering with explicit Letter Identifiers (A, B, C, D) and safe escaping
                const exercisesHtml = lesson.exercises.map((ex, index) => {
                    const safeQuestion = escapeHtml(ex.question);
                    const safeHint = escapeHtml(ex.hint || 'Analise atentamente o conteúdo estudado nesta aula.');
                    const safeExplanation = escapeHtml(ex.explanation || '');
                    
                    const optionsHtml = ex.options ? ex.options.map((opt, optIdx) => {
                        const letter = optionLabels[optIdx] || (optIdx + 1);
                        const safeOpt = escapeHtml(opt);
                        return `
                            <label class="flex items-center space-x-3 p-3 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer transition-colors">
                                <input type="radio" name="ex-${ex.id}" value="${optIdx}" class="text-brand-600 focus:ring-brand-500 h-4 w-4">
                                <span class="text-slate-800 text-sm font-semibold min-w-[24px] text-center bg-slate-100 rounded-md py-0.5 border border-slate-200">${letter}</span>
                                <span class="text-slate-700 text-sm font-medium flex-grow">${safeOpt}</span>
                            </label>
                        `;
                    }).join('') : '';

                    const correctIndex = typeof ex.correct === 'number' ? ex.correct : 0;
                    const correctLetter = optionLabels[correctIndex] || (correctIndex + 1);
                    const correctText = ex.options && ex.options[correctIndex] ? escapeHtml(ex.options[correctIndex]) : '';

                    return `
                        <div class="bg-slate-50 border border-slate-200 rounded-2xl p-6 mb-6">
                            <div class="flex items-center justify-between mb-3">
                                <span class="bg-indigo-100 text-indigo-700 text-xs font-bold px-2.5 py-1 rounded-full">Exercício ${index + 1}</span>
                            </div>
                            <h4 class="font-bold text-slate-900 text-base mb-3">${safeQuestion}</h4>
                            
                            ${ex.options ? `<div class="space-y-2 mb-4" id="options-${ex.id}">${optionsHtml}</div>` : ''}

                            <div class="flex flex-wrap gap-3 items-center">
                                <button onclick="app.checkExercise('${ex.id}', ${correctIndex})" class="bg-brand-600 hover:bg-brand-700 text-white font-medium text-sm py-2 px-4 rounded-xl transition-colors shadow-sm">
                                    Responder
                                </button>
                                <button onclick="app.toggleHint('${ex.id}')" class="text-slate-600 hover:text-brand-600 text-sm font-medium px-3 py-2 rounded-xl border border-slate-200 bg-white hover:border-brand-300 transition-colors">
                                    <i class="fa-solid fa-lightbulb text-amber-500 mr-1"></i> Dica
                                </button>
                                <button onclick="app.toggleSolution('${ex.id}')" class="text-slate-600 hover:text-brand-600 text-sm font-medium px-3 py-2 rounded-xl border border-slate-200 bg-white hover:border-brand-300 transition-colors">
                                    <i class="fa-solid fa-key text-indigo-500 mr-1"></i> Revelar Solução
                                </button>
                            </div>

                            <div id="hint-${ex.id}" class="hidden mt-4 p-4 bg-amber-50 border border-amber-200 rounded-xl text-amber-800 text-sm">
                                <strong>💡 Dica:</strong> ${safeHint}
                            </div>

                            <div id="solution-${ex.id}" class="hidden mt-4 p-4 bg-indigo-50 border border-indigo-200 rounded-xl text-indigo-900 text-sm space-y-2">
                                <div><strong>🔑 Resposta Correta:</strong> Opção ${correctLetter}${correctText ? ') ' + correctText : ''}</div>
                                <div><strong>📖 Explicação:</strong> ${safeExplanation}</div>
                            </div>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="space-y-8 max-w-4xl mx-auto">
                        <!-- Navigation Header -->
                        <div class="flex items-center justify-between">
                            <button onclick="app.navigateToLevel('${level.id}')" class="text-sm text-brand-600 hover:text-brand-700 font-medium flex items-center space-x-1">
                                <i class="fa-solid fa-arrow-left mr-1"></i> Voltar aos módulos deste nível
                            </button>
                            <span class="text-xs font-semibold px-3 py-1 rounded-full bg-slate-100 text-slate-600 uppercase tracking-wide">${escapeHtml(level.title)}</span>
                        </div>

                        <!-- Lesson Header & Objectives -->
                        <div class="bg-white border border-slate-200 rounded-3xl p-6 md:p-8 shadow-sm">
                            <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900 mb-4">${escapeHtml(lesson.title)}</h1>
                            <div class="bg-indigo-50 border border-indigo-100 rounded-2xl p-5 mb-6">
                                <h3 class="font-bold text-indigo-900 mb-3 flex items-center">
                                    <i class="fa-solid fa-bullseye mr-2 text-indigo-600"></i> Objetivos de Aprendizagem
                                </h3>
                                <ul class="space-y-2">
                                    ${objectivesHtml}
                                </ul>
                            </div>

                            <!-- Theory Content -->
                            <div class="prose max-w-none text-slate-700 space-y-4 mb-8">
                                ${lesson.theory}
                            </div>

                            <!-- Live Code Sandbox (Interactive Editor & Preview) -->
                            <div class="mb-8 border border-slate-300 rounded-2xl overflow-hidden shadow-sm bg-slate-900">
                                <div class="bg-slate-800 px-4 py-3 flex items-center justify-between text-slate-200 text-sm font-medium">
                                    <div class="flex items-center space-x-2">
                                        <i class="fa-solid fa-code text-indigo-400"></i>
                                        <span>Editor Interativo & Pré-visualização</span>
                                    </div>
                                    <span class="text-xs text-slate-400">Edite o código abaixo e veja o resultado em tempo real</span>
                                </div>
                                <div class="grid grid-cols-1 lg:grid-cols-2 divide-y lg:divide-y-0 lg:divide-x divide-slate-800">
                                    <div class="p-4 flex flex-col">
                                        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-2">Código HTML / CSS Editável</label>
                                        <textarea id="sandbox-code" class="w-full h-48 bg-slate-950 text-emerald-400 p-3 rounded-xl code-font text-xs resize-y outline-none focus:ring-1 focus:ring-brand-500 custom-scrollbar" oninput="app.updateSandboxPreview()">${escapeHtml(lesson.codeExample)}</textarea>
                                        <span class="text-xs text-slate-500 mt-2">Dica: Você pode incluir tags &lt;style&gt; diretamente ou testar qualquer trecho.</span>
                                    </div>
                                    <div class="p-4 flex flex-col bg-white">
                                        <label class="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Pré-visualização Ao Vivo</label>
                                        <div class="w-full h-48 border border-slate-200 rounded-xl overflow-hidden bg-white">
                                            <iframe id="sandbox-iframe" class="w-full h-full border-0"></iframe>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Exercises Section -->
                            <div class="border-t border-slate-200 pt-8 mt-8">
                                <h3 class="text-xl font-bold text-slate-900 mb-6 flex items-center">
                                    <i class="fa-solid fa-dumbbell mr-2 text-brand-600"></i> Exercícios Práticos da Aula
                                </h3>
                                ${exercisesHtml}
                            </div>

                            <!-- Review Summary Box -->
                            <div class="mt-8 bg-emerald-50 border border-emerald-200 rounded-2xl p-6">
                                <h4 class="font-bold text-emerald-900 mb-2 flex items-center">
                                    <i class="fa-solid fa-clipboard-check mr-2 text-emerald-600"></i> Revisão dos Conceitos Principais
                                </h4>
                                <p class="text-emerald-800 text-sm leading-relaxed">${escapeHtml(lesson.review)}</p>
                            </div>

                            <!-- Mandatory Bottom Lesson Actions -->
                            <div class="mt-8 pt-6 border-t border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-4">
                                <button onclick="app.navigateToLevel('${level.id}')" class="w-full sm:w-auto bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-3 px-6 rounded-xl transition-colors shadow-sm flex items-center justify-center space-x-2 border border-slate-300">
                                    <i class="fa-solid fa-arrow-left text-sm"></i>
                                    <span>Voltar aos módulos deste nível</span>
                                </button>
                                <button onclick="app.toggleLessonCompletion('${lesson.id}')" class="w-full sm:w-auto px-6 py-3 rounded-xl font-bold text-sm transition-colors shadow-sm flex items-center justify-center space-x-2 ${isDone ? 'bg-emerald-600 hover:bg-emerald-700 text-white' : 'bg-brand-600 hover:bg-brand-700 text-white'}">
                                    <i class="fa-solid ${isDone ? 'fa-check-circle' : 'fa-circle'}"></i>
                                    <span>${isDone ? 'Aula Concluída' : 'Marcar Concluída'}</span>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            },

            renderProjectView() {
                const level = courseData.levels.find(l => l.id === this.state.currentLevelId);
                if (!level || !level.capstone) return this.navigateToHome();
                const project = level.capstone;

                return `
                    <div class="space-y-8 max-w-5xl mx-auto">
                        <button onclick="app.navigateToLevel('${level.id}')" class="text-sm text-brand-600 hover:text-brand-700 font-medium flex items-center space-x-1">
                            <i class="fa-solid fa-arrow-left mr-1"></i> Voltar para os Módulos do Nível
                        </button>

                        <div class="bg-white border border-slate-200 rounded-3xl p-6 md:p-8 shadow-sm">
                            <div class="flex items-center space-x-3 mb-4">
                                <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 text-white flex items-center justify-center text-xl shadow-md">
                                    <i class="fa-solid fa-laptop-code"></i>
                                </div>
                                <div>
                                    <span class="text-xs font-semibold px-3 py-1 rounded-full bg-indigo-100 text-indigo-700 uppercase tracking-wide">Projeto Prático de Conclusão</span>
                                    <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900">${project.title}</h1>
                                </div>
                            </div>
                            <p class="text-slate-600 mb-8 leading-relaxed">${project.description}</p>

                            <!-- Capstone Dual Editor & Live Preview -->
                            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                                <div class="flex flex-col space-y-4">
                                    <div class="bg-slate-900 rounded-2xl overflow-hidden shadow-sm flex flex-col">
                                        <div class="bg-slate-800 px-4 py-3 text-slate-200 text-sm font-medium flex items-center justify-between">
                                            <span><i class="fa-brands fa-html5 text-orange-400 mr-2"></i> Editor HTML</span>
                                        </div>
                                        <textarea id="project-html" class="w-full h-64 bg-slate-950 text-orange-300 p-4 code-font text-xs resize-y outline-none custom-scrollbar" oninput="app.updateProjectPreview()">${project.initialHtml}</textarea>
                                    </div>
                                    <div class="bg-slate-900 rounded-2xl overflow-hidden shadow-sm flex flex-col">
                                        <div class="bg-slate-800 px-4 py-3 text-slate-200 text-sm font-medium flex items-center justify-between">
                                            <span><i class="fa-brands fa-css3-alt text-blue-400 mr-2"></i> Editor CSS</span>
                                        </div>
                                        <textarea id="project-css" class="w-full h-64 bg-slate-950 text-blue-300 p-4 code-font text-xs resize-y outline-none custom-scrollbar" oninput="app.updateProjectPreview()">${project.initialCss}</textarea>
                                    </div>
                                </div>
                                <div class="flex flex-col">
                                    <div class="bg-white border border-slate-300 rounded-2xl overflow-hidden shadow-sm flex flex-col h-full">
                                        <div class="bg-slate-100 px-4 py-3 text-slate-700 text-sm font-medium border-b border-slate-200 flex items-center justify-between">
                                            <span><i class="fa-solid fa-eye text-brand-600 mr-2"></i> Pré-visualização do Projeto</span>
                                            <span class="text-xs text-slate-500">Resultado em tempo real</span>
                                        </div>
                                        <div class="flex-grow min-h-[540px] bg-white">
                                            <iframe id="project-iframe" class="w-full h-full border-0"></iframe>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="flex justify-end">
                                <button onclick="app.showModal('Projeto Concluído!', 'Parabéns por testar e estruturar o projeto prático deste nível com sucesso!', 'fa-trophy', 'text-amber-500', 'bg-amber-100')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-8 rounded-xl shadow transition-colors flex items-center space-x-2">
                                    <i class="fa-solid fa-check"></i>
                                    <span>Concluir Projeto e Avançar</span>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            },

            updateSandboxPreview() {
                const codeArea = document.getElementById('sandbox-code');
                const iframe = document.getElementById('sandbox-iframe');
                if (!codeArea || !iframe) return;
                
                const content = codeArea.value;
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                doc.open();
                doc.write(content);
                doc.close();
            },

            updateProjectPreview() {
                const htmlArea = document.getElementById('project-html');
                const cssArea = document.getElementById('project-css');
                const iframe = document.getElementById('project-iframe');
                if (!htmlArea || !cssArea || !iframe) return;

                const htmlContent = htmlArea.value;
                const cssContent = cssArea.value;

                const fullDoc = `
                    <!DOCTYPE html>
                    <html lang="pt-BR">
                    <head>
                        <meta charset="UTF-8">
                        <style>${cssContent}</style>
                    </head>
                    <body>
                        ${htmlContent}
                    </body>
                    </html>
                `;

                const doc = iframe.contentDocument || iframe.contentWindow.document;
                doc.open();
                doc.write(fullDoc);
                doc.close();
            },

            checkExercise(exId, correctIndex) {
                const optionsContainer = document.getElementById(`options-${exId}`);
                if (!optionsContainer) return;
                const selected = optionsContainer.querySelector(`input[name="ex-${exId}"]:checked`);
                
                if (!selected) {
                    this.showModal('Atenção', 'Por favor, selecione uma alternativa antes de responder.', 'fa-circle-exclamation', 'text-amber-600', 'bg-amber-100');
                    return;
                }

                const answer = parseInt(selected.value);
                const letter = optionLabels[answer] || (answer + 1);

                if (answer === correctIndex) {
                    this.showModal('Resposta Correta!', `Parabéns! A opção (${letter}) está correta.`, 'fa-circle-check', 'text-emerald-600', 'bg-emerald-100');
                } else {
                    this.showModal('Incorreto', `Ops! A opção (${letter}) está incorreta. Reveja a explicação ou consulte a dica para tentar novamente.`, 'fa-circle-xmark', 'text-red-600', 'bg-red-100');
                }
            },

            toggleHint(exId) {
                const hintEl = document.getElementById(`hint-${exId}`);
                if (hintEl) hintEl.classList.toggle('hidden');
            },

            toggleSolution(exId) {
                const solEl = document.getElementById(`solution-${exId}`);
                if (solEl) solEl.classList.toggle('hidden');
            }
        };

        // Initialize application on window load
        window.onload = function() {
            app.init();
        };
    </script>
</body>
</html>
